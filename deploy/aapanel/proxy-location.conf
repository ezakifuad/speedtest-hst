# Masukkan di DALAM server {} situs speedtest.hstkab.go.id yang dikelola aaPanel.
# Sesuaikan/hapus location / bawaan yang sama; jangan buat duplikat.
# Pertahankan konfigurasi SSL/ACME milik aaPanel.
client_max_body_size 64m;
gzip off;
location / {
    proxy_pass http://127.0.0.1:8093;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
location = /admin.php {
    limit_req zone=hst_admin burst=5 nodelay;
    proxy_pass http://127.0.0.1:8093;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
